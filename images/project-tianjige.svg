  <circle cx="920" cy="196" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3"/>
  <text x="80" y="520" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="64" font-weight="700" fill="#ffffff">天机阁 · 玄学研究院</text>
  <text x="80" y="580" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="28" fill="#ffffff" fill-opacity="0.75">可溯源的传统文化数字化平台</text>
